$kind: http-request
name: POST Create Component
method: POST
url: '{{baseUrl}}/api/core/components/'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "PCB Board",
      "description": "Printed circuit board component"
    }
