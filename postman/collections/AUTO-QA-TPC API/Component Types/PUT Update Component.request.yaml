$kind: http-request
name: PUT Update Component
method: PUT
url: '{{baseUrl}}/api/core/components/{{componentId}}/'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "PCB Board",
      "description": "Updated description"
    }
