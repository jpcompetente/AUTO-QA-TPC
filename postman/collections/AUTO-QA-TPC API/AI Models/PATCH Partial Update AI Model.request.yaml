$kind: http-request
name: PATCH Partial Update AI Model
method: PATCH
url: '{{baseUrl}}/api/core/ai-models/{{modelId}}/'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "is_active": true
    }
