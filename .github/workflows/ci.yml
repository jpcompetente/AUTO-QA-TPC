name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature-inference

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_qa_ci
          POSTGRES_USER: auto_qa
          POSTGRES_PASSWORD: auto_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_qa -d auto_qa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "True"
      DB_NAME: auto_qa_ci
      DB_USER: auto_qa
      DB_PASSWORD: auto_qa
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      INFERENCE_SERVER_URL: http://127.0.0.1:8091
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run backend tests
        run: python manage.py test core --verbosity 2

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-vite
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend-vite
        run: npm run lint

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build